<!-- Interactive Script for micro-interactions -->
<script>
    function triggerUndoCoach() {
      const banner = document.querySelector('aside');
      if (banner) {
        banner.classList.add('scale-95', 'opacity-80');
        setTimeout(() => {
          banner.classList.remove('scale-95', 'opacity-80');
        }, 200);
      }
    }

    function handleToolbarAction(type) {
      if (type === 'hint') {
        const bestBadge = document.querySelector('.bg-secondary.text-on-secondary');
        if (bestBadge) {
          bestBadge.classList.add('scale-125');
          setTimeout(() => bestBadge.classList.remove('scale-125'), 350);
        }
      }
    }
  </script>
